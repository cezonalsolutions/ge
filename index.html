/* =============================

const SUPABASE_URL =

"https://ycqwdeiykbkfmmlpgdzd.supabase.co";





const SUPABASE_KEY =

"sb_publishable_-4RzQVudUy_VsvSpHTxNfg_hrdsQW0j";





const sb =

window.supabase.createClient(

  SUPABASE_URL,

  SUPABASE_KEY

);







/* =============================

   ELEMENTS

============================= */



const loginPage =

document.getElementById(

  "loginPage"

);





const mainUI =

document.getElementById(

  "mainUI"

);





const loginForm =

document.getElementById(

  "loginForm"

);





const mobile =

document.getElementById(

  "mobile"

);





const password =

document.getElementById(

  "password"

);





const loginBtn =

document.getElementById(

  "loginBtn"

);





const message =

document.getElementById(

  "message"

);
let currentVendor = null;







/* =============================

   NUMBERS ONLY

============================= */



mobile.addEventListener(

"input",

function(){



  this.value =

    this.value

      .replace(/\D/g,"")

      .slice(0,10);



});







/* =============================

   KEYBOARD

============================= */



(function(){



  let baseHeight =

    window.visualViewport

      ? window.visualViewport.height

      : window.innerHeight;





  function updateKeyboard(){



    if(!window.visualViewport){

      return;

    }





    const difference =

      baseHeight -

      window.visualViewport.height;





    document.body.classList.toggle(

      "keyboard-open",

      difference > 140

    );



  }





  if(window.visualViewport){



    window.visualViewport.addEventListener(

      "resize",

      updateKeyboard

    );



  }





  [mobile,password].forEach(input=>{



    input.addEventListener(

      "focus",

      ()=>setTimeout(

        updateKeyboard,

        100

      )

    );





    input.addEventListener(

      "blur",

      ()=>{



        setTimeout(()=>{



          if(

            document.activeElement !== mobile &&

            document.activeElement !== password

          ){



            document.body.classList.remove(

              "keyboard-open"

            );



          }



        },150);



      }

    );



  });



})();

  "vijaya_lakshmi_products",
  "juttigastore"
];

const PRODUCTS_PAGE_SIZE = 12;

let vendorProductsCache = [];
    vendorProductsVisibleCount = 0;
    disconnectVendorProductsObserver();
let vendorProductsVisibleCount = 0;
let vendorProductsObserver = null;
let vendorProductsLoadingMore = false;


function getVendorProductId(){
  return currentVendor?.id ?? null;
}


function escapeVendorHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function isVendorProductOutOfStock(product){

  if(product.in_stock === false){
    return true;
  }

  if(
    typeof product.stock === "number" &&
    product.stock <= 0
  ){
    return true;
  }

  if(
    typeof product.stock_quantity === "number" &&
    product.stock_quantity <= 0
  ){
    return true;
  }

  if(
    typeof product.available_quantity === "number" &&
    product.available_quantity <= 0
  ){
    return true;
  }

  const status =
    String(
      product.stock_status ??
      product.availability ??
      ""
    )
    .trim()
    .toLowerCase();

  return [
    "out of stock",
    "out_of_stock",
    "unavailable"
  ].includes(status);
}


async function fetchLoggedVendorProducts(){

  const vendorId =
    getVendorProductId();

  if(vendorId == null){
    return [];
  }

  const jobs =
    PRODUCT_TABLES.map(
      async table => {

        try{

          const {
            data,
            error
          } =
          await sb
            .from(table)
            .select("*")
            .eq(
              "vendor_id",
              vendorId
            );

          if(error){
            console.warn(
              "Product table:",
              table,
              error.message
            );
            return [];
          }

          return (data || []).map(
            product => ({
              ...product,
              _table:table
            })
          );

        }catch(error){

          console.warn(
            "Product load:",
            table,
            error
          );

          return [];
        }

      }
    );

  const results =
    await Promise.all(jobs);

  return results.flat();
}


function vendorProductCardHtml(product){

  const name =
    product.product_name ||
    product.name ||
    "Product";

  const image =
    product.image1 ||
    product.image ||
    "";

  const quantity =
    product.quantity ?? "";

  const unit =
    product.unit ?? "";

  const price =
    product.discount_price ??
    product.price ??
    product.original_price ??
    "";

  const original =
    product.original_price ?? "";

  const oldPrice =
    original !== "" &&
    price !== "" &&
    Number(original) > Number(price)
      ? `<span class="vendorProductOldPrice">₹${escapeVendorHtml(original)}</span>`
      : "";

  return `
    <article class="vendorProductCard">

      <div class="vendorProductImage">
        ${
          image
          ? `<img src="${escapeVendorHtml(image)}" alt="${escapeVendorHtml(name)}" loading="lazy">`
          : ""
        }
      </div>

      <div class="vendorProductName">
        ${escapeVendorHtml(name)}
      </div>

      <div class="vendorProductMeta">
        ${escapeVendorHtml(quantity)} ${escapeVendorHtml(unit)}
      </div>

      <div class="vendorProductPrice">
        ${price !== "" ? "₹" + escapeVendorHtml(price) : ""}
        ${oldPrice}
      </div>

    </article>
  `;
}


function disconnectVendorProductsObserver(){

  if(vendorProductsObserver){
    vendorProductsObserver.disconnect();
    vendorProductsObserver = null;
  }

}


function setupVendorProductsObserver(){

  disconnectVendorProductsObserver();

  const sentinel =
    document.getElementById(
      "vendorProductsLoadMore"
    );

  if(
    !sentinel ||
    sentinel.classList.contains("hidden")
  ){
    return;
  }

  vendorProductsObserver =
    new IntersectionObserver(
      entries=>{

        if(
          entries.some(entry=>entry.isIntersecting)
        ){
          loadNextVendorProducts();
        }

      },
      {
        root:null,
        rootMargin:"100px 0px",
        threshold:0.01
      }
    );

  vendorProductsObserver.observe(
    sentinel
  );
}


function renderVendorProductsInitial(){

  const grid =
    document.getElementById(
      "vendorProductsGrid"
    );

  if(!grid){
    return;
  }

  disconnectVendorProductsObserver();

  if(!vendorProductsCache.length){

    grid.innerHTML =
      '<div class="vendorProductsState">No products found</div>';

    return;
  }

  vendorProductsVisibleCount =
    Math.min(
      PRODUCTS_PAGE_SIZE,
      vendorProductsCache.length
    );

  const firstProducts =
    vendorProductsCache.slice(
      0,
      vendorProductsVisibleCount
    );

  const hasMore =
    vendorProductsVisibleCount <
    vendorProductsCache.length;

  grid.innerHTML =
    firstProducts
      .map(vendorProductCardHtml)
      .join("") +
    `
      <div
        class="vendorProductsLoadMore ${hasMore ? "" : "hidden"}"
        id="vendorProductsLoadMore"
      >
        <div class="vendorProductsSpinner"></div>
      </div>
    `;

  if(hasMore){
    setupVendorProductsObserver();
  }
}


function loadNextVendorProducts(){

  if(vendorProductsLoadingMore){
    return;
  }

  if(
    vendorProductsVisibleCount >=
    vendorProductsCache.length
  ){
    disconnectVendorProductsObserver();
    return;
  }

  vendorProductsLoadingMore = true;

  const sentinel =
    document.getElementById(
      "vendorProductsLoadMore"
    );

  if(sentinel){
    sentinel.classList.remove("hidden");
  }

  /*
    Small delay lets the spinner be visible naturally
    while the next local batch is painted.
  */
  setTimeout(()=>{

    const grid =
      document.getElementById(
        "vendorProductsGrid"
      );

    if(!grid){
      vendorProductsLoadingMore = false;
      return;
    }

    const nextEnd =
      Math.min(
        vendorProductsVisibleCount +
        PRODUCTS_PAGE_SIZE,
        vendorProductsCache.length
      );

    const nextProducts =
      vendorProductsCache.slice(
        vendorProductsVisibleCount,
        nextEnd
      );

    if(sentinel){
      sentinel.insertAdjacentHTML(
        "beforebegin",
        nextProducts
          .map(vendorProductCardHtml)
          .join("")
      );
    }

    vendorProductsVisibleCount =
      nextEnd;

    vendorProductsLoadingMore =
      false;

    if(
      vendorProductsVisibleCount >=
      vendorProductsCache.length
    ){

      if(sentinel){
        sentinel.classList.add("hidden");
      }

      disconnectVendorProductsObserver();

    }

  },220);
}


async function loadVendorProducts(){

  const grid =
    document.getElementById(
      "vendorProductsGrid"
    );

  if(grid){

    grid.innerHTML =
      `
        <div class="vendorProductsLoadMore">
          <div class="vendorProductsSpinner"></div>
        </div>
      `;

  }

  disconnectVendorProductsObserver();

  vendorProductsVisibleCount = 0;
  vendorProductsLoadingMore = false;

  vendorProductsCache =
    await fetchLoggedVendorProducts();

  renderVendorProductsInitial();

  updateProfileProductStats(
    vendorProductsCache
  );
}


function updateProfileProductStats(products){

  const totalEl =
    document.getElementById(
      "profileTotalProducts"
    );

  const outEl =
    document.getElementById(
      "profileOutOfStock"
    );

  if(totalEl){
    totalEl.textContent =
      String(products.length);
  }

  if(outEl){
    outEl.textContent =
      String(
        products.filter(
          isVendorProductOutOfStock
        ).length
      );
  }
}


async function loadProfileProductStats(vendor){

  if(!vendorProductsCache.length){
    vendorProductsCache =
      await fetchLoggedVendorProducts();
  }

  updateProfileProductStats(
    vendorProductsCache
  );
}


function openMainUI(vendor){



  currentVendor = vendor;





  const name =

    vendor.vendor_name ||

    vendor.name ||

    "Vendor";





  const phone =

    vendor.mobile ||

    "—";





  const location =

    vendor.location ||

    vendor.vendor_location ||

    vendor.address ||

    "—";





  /* PROFILE DATA */



  document.getElementById(

    "profileVendorName"

  ).textContent = name;





  document.getElementById(

    "profileVendorMobile"

  ).textContent = phone;





  document.getElementById(

    "profileName"

  ).textContent = name;





  document.getElementById(

    "profileMobile"

  ).textContent = phone;





  document.getElementById(

    "profileLocation"

  ).textContent = location;

  /* LOGIN CLOSE */

  try{

      .from(

      .select("*")

function hideAppPreloader(){

  const loader =
    document.getElementById("appPreloader");

  if(!loader){
    return;
  }

  loader.classList.add("hide");

  setTimeout(()=>{
    loader.remove();
  },260);

}

async function restoreLogin(){

  const id =
    localStorage.getItem(
      "cezoo_vendor_id"
    );


  /* No saved login -> show login only after preload */
  if(!id){

    loginPage.style.display =
      "block";

    mainUI.style.display =
      "none";

    hideAppPreloader();

    return;
  }


  try{

    /*
      Saved vendor exists:
      keep preload visible while Supabase verifies session.
    */

    const {
      data,
      error
    } =
    await sb
      .from(
        "vendor_login"
      )
      .select("*")
      .eq(
        "id",
        id
      )
      .maybeSingle();


    if(error){
      throw error;
    }


    if(!data){

      localStorage.removeItem(
        "cezoo_vendor_id"
      );

      loginPage.style.display =
        "block";

      mainUI.style.display =
        "none";

      return;
    }


    /*
      Valid saved session:
      open Main UI BEFORE removing preload.
      So refresh lo login screen flash avvadu.
    */

    openMainUI(
      data
    );


  }catch(error){

    console.error(
      "Restore login:",
      error
    );


    localStorage.removeItem(
      "cezoo_vendor_id"
    );


    loginPage.style.display =
      "block";

    mainUI.style.display =
      "none";


  }finally{

    hideAppPreloader();

  }

}

function openVendorPage(pageId){



  vendorPages.forEach(page=>{



    page.classList.toggle(

      "active",

      page.id === pageId

    );



  });





  vendorNavItems.forEach(item=>{



    item.classList.toggle(

      "active",

      item.dataset.page === pageId

    );



  });





  window.scrollTo(

    0,

    0

  );



}







vendorNavItems.forEach(item=>{



  item.addEventListener(

    "click",

    function(){



      openVendorPage(

        this.dataset.page

      );



    }

  );



});
