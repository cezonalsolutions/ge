<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<title>CEZOO Vendor</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100dvh;
  font-family:Arial,sans-serif;
  background:#fff;
}


/* =========================
   LOGIN PAGE
========================= */

.loginPage{
  width:100%;
  min-height:100dvh;
  background:#fff;
}


/* TOP IMAGE */

.loginTop{
  width:100%;
  height:48dvh;
  min-height:350px;

  background:#eef4fb;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  padding:15px 8px 0;

  transition:.25s ease;
}

.loginTop img{
  width:115%;
  max-width:430px;

  height:115%;
  max-height:430px;

  object-fit:contain;
  display:block;

  transform:translateY(35px);
}


/* LOGIN AREA */

.loginBottom{
  position:relative;

  width:100%;
  min-height:52dvh;

  margin-top:-28px;

  padding:
    48px
    30px
    calc(35px + env(safe-area-inset-bottom));

  background:#fff;

  border-radius:32px 32px 0 0;

  z-index:2;

  transition:.25s ease;
}


/* TITLE */

.loginTitle{
  margin:0 0 30px;

  text-align:center;

  color:#685cff;

  font-size:32px;
  font-weight:900;
}


/* INPUT */

.loginInput{
  display:block;

  width:100%;
  height:55px;

  margin-bottom:15px;

  padding:0 20px;

  border:2px solid #e4e9f1;
  border-radius:25px;

  background:#fff;

  color:#222;

  font-size:15px;

  outline:none;

  -webkit-appearance:none;
  appearance:none;
}

.loginInput::placeholder{
  color:#777;
}

.loginInput:focus{
  border-color:#685cff;

  box-shadow:
    0 0 0 3px
    rgba(104,92,255,.08);
}


/* BUTTON */

.loginButton{
  width:100%;
  height:54px;

  margin-top:2px;

  border:0;
  border-radius:25px;

  background:
    linear-gradient(
      90deg,
      #675cff,
      #7163ff
    );

  color:#fff;

  font-size:16px;
  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 7px 18px
    rgba(103,92,255,.20);
}

.loginButton:active{
  transform:scale(.97);
}

.loginButton:disabled{
  opacity:.6;
}


/* ERROR */

.loginMessage{
  display:none;

  margin-top:14px;

  text-align:center;

  color:#e54848;

  font-size:13px;
  font-weight:600;
}

.loginMessage.error{
  display:block;
}


/* =========================
   KEYBOARD OPEN
========================= */

body.keyboard-open .loginTop{
  height:0;
  min-height:0;

  padding:0;

  opacity:0;

  pointer-events:none;
}

body.keyboard-open .loginTop img{
  display:none;
}
/* =========================
   KEYBOARD OPEN — HALF MOVE ONLY
========================= */

body.keyboard-open .loginTop{
  height:24dvh;
  min-height:170px;

  padding:0 8px;

  opacity:1;

  pointer-events:none;

  overflow:hidden;
}


/* image half paiki slide */
body.keyboard-open .loginTop img{
  display:block;

  width:105%;
  height:280px;

  object-fit:contain;

  transform:translateY(-55px);
}


/* login sheet konchem matrame paiki */
body.keyboard-open .loginBottom{
  min-height:auto;

  margin-top:-25px;

  padding-top:30px;

  border-radius:32px 32px 0 0;
}


body.keyboard-open .loginTitle{
  margin-bottom:22px;
}


/* =========================
   MAIN UI
========================= */

#mainUI{
  display:none;

  width:100%;
  min-height:100dvh;

  background:#fff;

  padding:
    calc(30px + env(safe-area-inset-top))
    22px
    30px;
}


/* FOR NOW VENDOR NAME ONLY */

.vendorWelcome{
  font-size:14px;
  color:#777;
  margin-bottom:5px;
}

.vendorName{
  font-size:28px;
  font-weight:900;
  color:#171717;
}


/* SMALL MOBILE */

@media(max-width:380px){

  .loginTop{
    height:46dvh;
    min-height:320px;
  }

  .loginTop img{
    width:120%;
    height:120%;

    transform:translateY(32px);
  }

  .loginBottom{
    padding-left:24px;
    padding-right:24px;
  }

}

</style>
</head>


<body>


<!-- =============================
     LOGIN SCREEN
============================= -->

<div
  class="loginPage"
  id="loginPage"
>


  <div class="loginTop">

    <img
      src="vendor.webp"
      alt="Vendor"
    >

  </div>


  <div class="loginBottom">

    <h1 class="loginTitle">
      Login
    </h1>


    <form id="loginForm">


      <input
        class="loginInput"
        id="mobile"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="Mobile Number"
        autocomplete="username"
      >


      <input
        class="loginInput"
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >


      <button
        class="loginButton"
        id="loginBtn"
        type="submit"
      >
        Sign In
      </button>


      <div
        class="loginMessage"
        id="message"
      ></div>


    </form>

  </div>

</div>



<!-- =============================
     MAIN UI
============================= -->

<div id="mainUI">

  <div class="vendorWelcome">
    Welcome
  </div>

  <div
    class="vendorName"
    id="vendorName"
  >
    Vendor
  </div>

</div>



<script>

/* =============================
   SUPABASE
============================= */

const SUPABASE_URL =
"https://ycqwdeiykbkfmmlpgdzd.supabase.co";


const SUPABASE_KEY =
"sb_publishable_-4RzQVudUy_VsvSpHTxNfg_hrdsQW0j";


const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);



/* =============================
   ELEMENTS
============================= */

const loginPage =
document.getElementById(
  "loginPage"
);


const mainUI =
document.getElementById(
  "mainUI"
);


const loginForm =
document.getElementById(
  "loginForm"
);


const mobile =
document.getElementById(
  "mobile"
);


const password =
document.getElementById(
  "password"
);


const loginBtn =
document.getElementById(
  "loginBtn"
);


const message =
document.getElementById(
  "message"
);


const vendorName =
document.getElementById(
  "vendorName"
);


let currentVendor = null;



/* =============================
   NUMBERS ONLY
============================= */

mobile.addEventListener(
"input",
function(){

  this.value =
    this.value
      .replace(/\D/g,"")
      .slice(0,10);

});



/* =============================
   KEYBOARD
============================= */

(function(){

  let baseHeight =
    window.visualViewport
      ? window.visualViewport.height
      : window.innerHeight;


  function updateKeyboard(){

    if(!window.visualViewport){
      return;
    }


    const difference =
      baseHeight -
      window.visualViewport.height;


    document.body.classList.toggle(
      "keyboard-open",
      difference > 140
    );

  }


  if(window.visualViewport){

    window.visualViewport.addEventListener(
      "resize",
      updateKeyboard
    );

  }


  [mobile,password].forEach(input=>{

    input.addEventListener(
      "focus",
      ()=>setTimeout(
        updateKeyboard,
        100
      )
    );


    input.addEventListener(
      "blur",
      ()=>{

        setTimeout(()=>{

          if(
            document.activeElement !== mobile &&
            document.activeElement !== password
          ){

            document.body.classList.remove(
              "keyboard-open"
            );

          }

        },150);

      }
    );

  });

})();



/* =============================
   ERROR
============================= */

function showError(text){

  message.textContent =
    text;

  message.className =
    "loginMessage error";

}


function clearError(){

  message.textContent =
    "";

  message.className =
    "loginMessage";

}



/* =============================
   OPEN MAIN UI
============================= */

function openMainUI(vendor){

  currentVendor =
    vendor;


  /* VENDOR NAME */

  vendorName.textContent =
    vendor.vendor_name ||
    vendor.name ||
    "Vendor";


  /* HIDE KEYBOARD MODE */

  document.body.classList.remove(
    "keyboard-open"
  );


  /* LOGIN HIDE */

  loginPage.style.display =
    "none";


  /* MAIN UI OPEN */

  mainUI.style.display =
    "block";

}



/* =============================
   LOGIN
============================= */

loginForm.addEventListener(
"submit",
async function(event){

  event.preventDefault();


  clearError();


  const phone =
    mobile.value
      .replace(/\D/g,"")
      .trim();


  const pass =
    password.value.trim();



  /* MOBILE */

  if(
    !/^[0-9]{10}$/.test(phone)
  ){

    showError(
      "Enter valid mobile number"
    );

    return;

  }



  /* PASSWORD */

  if(!pass){

    showError(
      "Enter password"
    );

    return;

  }



  loginBtn.disabled =
    true;


  loginBtn.textContent =
    "Signing in...";


  try{


    const {
      data,
      error
    } =
    await sb
      .from(
        "vendor_login"
      )
      .select("*")
      .eq(
        "mobile",
        phone
      )
      .eq(
        "password",
        pass
      )
      .maybeSingle();



    if(error){

      throw error;

    }



    if(!data){

      showError(
        "Wrong mobile number or password"
      );

      return;

    }



    /* =========================
       SUCCESS
    ========================= */

    currentVendor =
      data;


    localStorage.setItem(
      "cezoo_vendor_id",
      String(data.id)
    );


    /*
      NO REDIRECT.

      SAME HTML MAIN UI OPEN.
    */

    openMainUI(
      data
    );


  }catch(error){


    console.error(
      "Login error:",
      error
    );


    showError(
      "Unable to login. Please try again."
    );


  }finally{


    loginBtn.disabled =
      false;


    loginBtn.textContent =
      "Sign In";


  }

});



/* =============================
   RESTORE LOGIN
============================= */

async function restoreLogin(){

  const id =
    localStorage.getItem(
      "cezoo_vendor_id"
    );


  if(!id){
    return;
  }


  try{


    const {
      data,
      error
    } =
    await sb
      .from(
        "vendor_login"
      )
      .select("*")
      .eq(
        "id",
        id
      )
      .maybeSingle();


    if(error){
      throw error;
    }


    if(!data){

      localStorage.removeItem(
        "cezoo_vendor_id"
      );

      return;
    }


    openMainUI(
      data
    );


  }catch(error){


    console.error(
      "Restore login:",
      error
    );


    localStorage.removeItem(
      "cezoo_vendor_id"
    );

  }

}


restoreLogin();

</script>

</body>
</html>
