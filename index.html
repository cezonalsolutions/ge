<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
>

<title>Address</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  width:100%;
  max-width:100%;
  min-height:100vh;
  min-height:100dvh;

  background:#f1f2f4;
  overflow-x:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}


/* =========================
   PAGE
========================= */

.page{
  position:relative;

  width:100%;
  max-width:100%;

  min-height:100vh;
  min-height:100dvh;

  padding-top:85px;

  overflow-x:hidden;
}


/* =========================
   PAPER WRAPPER
========================= */

.paperWrap{
  position:relative;

  width:100%;
  max-width:100%;

  min-height:calc(100vh - 85px);
  min-height:calc(100dvh - 85px);

  overflow:visible;

  filter:
    drop-shadow(
      0 7px 18px rgba(0,0,0,.07)
    );
}


/* =========================
   WHITE CONTAINER
========================= */

.container{
  position:relative;

  width:100%;
  max-width:100%;

  min-height:calc(100vh - 85px);
  min-height:calc(100dvh - 85px);

  background:#ffffff;

  clip-path:polygon(
    0 0,
    calc(100% - 210px) 0,
    100% 72px,
    100% 100%,
    0 100%
  );

  overflow:hidden;
}


/* =========================
   BLUE FOLD
========================= */

.paperFold{
  position:absolute;

  top:0;
  right:0;

  width:210px;
  max-width:55vw;
  height:72px;

  z-index:20;

  pointer-events:none;

  background:
    linear-gradient(
      145deg,
      #89d2fa 0%,
      #a9e0fc 25%,
      #c8ecff 52%,
      #e5f7ff 76%,
      #ffffff 100%
    );

  clip-path:polygon(
    0 0,
    100% 72px,
    0 72px
  );

  filter:
    drop-shadow(
      -2px 4px 4px rgba(72,153,202,.16)
    );
}


/* =========================
   TATA IMAGE
========================= */

.tataImage{
  position:absolute;

  top:-88px;
  right:14px;

  width:165px;
  height:165px;

  object-fit:contain;

  z-index:30;

  pointer-events:none;

  transform:rotate(19deg);
  transform-origin:center;
}


/* =========================
   CONTENT
========================= */

.content{
  position:relative;

  z-index:2;

  width:100%;
  max-width:100%;

  min-height:calc(100vh - 85px);
  min-height:calc(100dvh - 85px);

  padding:
    18px
    18px
    125px;

  overflow:hidden;
}


/* =========================
   DESKTOP HEADING
========================= */

.addressHeading h1{
  margin:0;

  color:#17191c;

  font-size:28px;
  font-weight:800;

  line-height:1.15;

  letter-spacing:-0.8px;
}

.addressColor{
  color:#5b5bd6;
  font-weight:900;
}

.desktopHeading{
  display:block;
}

.desktopLine{
  display:block;
  white-space:nowrap;
}


/* =========================
   MOBILE HEADING
========================= */

.mobileHeading{
  display:none;
}

.orderingText{
  color:#5b5bd6;
  font-weight:900;
}

.forText{
  color:#24272b;
  font-weight:600;
}


/* =========================
   FRIEND / PARENTS / ME
========================= */

.orderTypeRow{
  width:100%;

  display:flex;
  align-items:center;

  gap:10px;

  margin-top:34px;
}

.orderTypeBox{
  flex:1;
  min-width:0;

  height:54px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#ffffff;

  border:1.5px solid #e0e1e6;
  border-radius:13px;

  color:#34363b;

  font-size:15px;
  font-weight:700;
}

.orderTypeBox.me{
  border-color:#5b5bd6;

  background:#f3f3ff;

  color:#5b5bd6;

  font-weight:800;
}


/* =========================
   ADDRESS FORM
========================= */

.addressForm{
  width:100%;
  margin-top:38px;
}


/* =========================
   LINE FIELD
========================= */

.lineField{
  position:relative;

  width:100%;

  margin-bottom:27px;
}

.lineField label{
  display:block;

  margin-bottom:7px;

  color:#50535a;

  font-size:13px;
  font-weight:700;
}

.lineField input{
  display:block;

  width:100%;
  height:32px;

  padding:0 1px 8px;

  border:none;
  border-bottom:1.4px solid #d7d9de;
  border-radius:0;

  outline:none;

  background:transparent;

  color:#1e2024;

  font-family:inherit;

  font-size:16px;
  font-weight:600;

  appearance:none;
  -webkit-appearance:none;
}

.lineField input::placeholder{
  color:#a9adb4;
  font-weight:500;
}

.lineField input:focus{
  border-bottom-color:#5b5bd6;
}


/* =========================
   TWO FIELDS
========================= */

.twoFields{
  width:100%;

  display:flex;

  gap:20px;
}

.twoFields .lineField{
  flex:1;
  min-width:0;
}


/* =========================
   RECEIVED ADDRESS
========================= */

.receivedAddress{
  width:100%;

  margin-top:-2px;
  margin-bottom:27px;

  padding-bottom:12px;

  border-bottom:1.4px solid #d7d9de;
}

.receivedAddressTitle{
  display:block;

  margin-bottom:8px;

  color:#50535a;

  font-size:13px;
  font-weight:700;
}

.receivedAddressText{
  margin:0;

  color:#777b82;

  font-size:14px;
  font-weight:550;

  line-height:1.45;
}


/* =========================
   FIXED SAVE BAR
========================= */

.saveAddressBar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  width:100%;

  z-index:100;

  padding:
    12px
    18px
    calc(12px + env(safe-area-inset-bottom));

  background:rgba(255,255,255,.96);

  border-top:1px solid #eeeef2;

  box-shadow:
    0 -8px 24px rgba(0,0,0,.06);
}

.saveAddressBtn{
  width:100%;
  height:54px;

  border:none;
  outline:none;

  border-radius:14px;

  background:#5b5bd6;

  color:#ffffff;

  font-family:inherit;

  font-size:16px;
  font-weight:800;

  cursor:pointer;
}

.saveAddressBtn:active{
  transform:scale(.99);
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  html,
  body,
  .page{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  .desktopHeading{
    display:none;
  }

  .mobileHeading{
    display:block;

    margin:0;

    font-size:26px;

    line-height:1.15;

    letter-spacing:-0.7px;

    white-space:nowrap;
  }

  .tataImage{
    top:-88px;
    right:14px;

    width:165px;
    height:165px;

    transform:rotate(19deg);
  }

  .content{
    padding-top:18px;
    padding-left:18px;
    padding-right:18px;
    padding-bottom:125px;
  }

  .orderTypeRow{
    gap:8px;
    margin-top:34px;
  }

  .orderTypeBox{
    height:52px;

    border-radius:12px;

    font-size:14px;
  }

  .addressForm{
    margin-top:38px;
  }

  .lineField{
    margin-bottom:25px;
  }

  .lineField label{
    margin-bottom:6px;

    font-size:13px;
    font-weight:700;
  }

  .lineField input{
    height:31px;

    font-size:16px;
    font-weight:600;
  }

  .twoFields{
    gap:18px;
  }

  .receivedAddress{
    margin-bottom:25px;
  }

  .receivedAddressTitle{
    font-size:13px;
    font-weight:700;
  }

  .receivedAddressText{
    font-size:14px;
  }

  .saveAddressBar{
    padding-left:16px;
    padding-right:16px;
  }

}

</style>
</head>


<body>

<div class="page">

  <div class="paperWrap">


    <!-- WHITE PAPER -->

    <div class="container">

      <div class="content">


        <!-- HEADING -->

        <div class="addressHeading">


          <!-- PC -->

          <h1 class="desktopHeading">

            <span class="desktopLine">
              Help us know your

              <span class="addressColor">
                Address
              </span>

            </span>

            <span class="desktopLine">
              better for delivery.
            </span>

          </h1>


          <!-- MOBILE -->

          <h1 class="mobileHeading">

            <span class="orderingText">
              Ordering
            </span>

            <span class="forText">
              for
            </span>

          </h1>


        </div>


        <!-- FRIEND / PARENTS / ME -->

        <div class="orderTypeRow">

          <div class="orderTypeBox">
            Friend
          </div>

          <div class="orderTypeBox">
            Parents
          </div>

          <div class="orderTypeBox me">
            Me
          </div>

        </div>


        <!-- ADDRESS FORM -->

        <div class="addressForm">


          <!-- FULL NAME -->

          <div class="lineField">

            <label>
              Full Name
            </label>

            <input
              type="text"
              placeholder="Enter full name"
              autocomplete="name"
            >

          </div>


          <!-- DOOR + ROOM -->

          <div class="twoFields">

            <div class="lineField">

              <label>
                Door No.
              </label>

              <input
                type="text"
                placeholder="Enter door no."
              >

            </div>


            <div class="lineField">

              <label>
                Room / Flat No.
              </label>

              <input
                type="text"
                placeholder="Enter flat no."
              >

            </div>

          </div>


          <!-- BUILDING NAME -->

          <div class="lineField">

            <label>
              Building Name
            </label>

            <input
              type="text"
              placeholder="Enter building name"
            >

          </div>


          <!-- =====================
               RECEIVED ADDRESS
               NO INPUT HERE
          ====================== -->

          <div class="receivedAddress">

            <span class="receivedAddressTitle">
              Received Address
            </span>

            <p class="receivedAddressText">
              Address will appear here
            </p>

          </div>


          <!-- APARTMENT -->

          <div class="lineField">

            <label>
              Apartment Name
            </label>

            <input
              type="text"
              placeholder="Enter apartment name"
            >

          </div>


          <!-- ROAD -->

          <div class="lineField">

            <label>
              Road / Street Name
            </label>

            <input
              type="text"
              placeholder="Enter road or street name"
            >

          </div>


          <!-- VILLAGE -->

          <div class="lineField">

            <label>
              Village / Area
            </label>

            <input
              type="text"
              placeholder="Enter village or area"
            >

          </div>


          <!-- CITY + PIN -->

          <div class="twoFields">

            <div class="lineField">

              <label>
                Town / City
              </label>

              <input
                type="text"
                placeholder="Town / City"
              >

            </div>


            <div class="lineField">

              <label>
                PIN Code
              </label>

              <input
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="PIN code"
              >

            </div>

          </div>


          <!-- LANDMARK -->

          <div class="lineField">

            <label>
              Landmark
            </label>

            <input
              type="text"
              placeholder="Nearby landmark"
            >

          </div>


        </div>

      </div>

    </div>


    <!-- BLUE FOLD -->

    <div class="paperFold"></div>


    <!-- TATA IMAGE -->

    <img
      src="tata.png"
      class="tataImage"
      alt=""
    >


  </div>

</div>


<!-- FIXED SAVE ADDRESS -->

<div class="saveAddressBar">

  <button
    class="saveAddressBtn"
    type="button"
  >
    Save Address
  </button>

</div>


</body>
</html>
