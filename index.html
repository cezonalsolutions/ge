<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
>

<title>Address</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  width:100%;
  max-width:100%;
  min-height:100vh;
  min-height:100dvh;

  background:#f1f2f4;
  overflow-x:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}


/* =========================
   PAGE
========================= */

.page{
  position:relative;

  width:100%;
  max-width:100%;

  min-height:100vh;
  min-height:100dvh;

  padding-top:85px;

  overflow-x:hidden;
}


/* =========================
   PAPER WRAPPER
========================= */

.paperWrap{
  position:relative;

  width:100%;
  max-width:100%;

  min-height:calc(100vh - 85px);
  min-height:calc(100dvh - 85px);

  overflow:visible;

  filter:
    drop-shadow(
      0 7px 18px rgba(0,0,0,.07)
    );
}


/* =========================
   WHITE CONTAINER
========================= */

.container{
  position:relative;

  width:100%;
  max-width:100%;

  min-height:calc(100vh - 85px);
  min-height:calc(100dvh - 85px);

  background:#ffffff;

  clip-path:polygon(
    0 0,
    calc(100% - 210px) 0,
    100% 72px,
    100% 100%,
    0 100%
  );

  overflow:hidden;
}


/* =========================
   BLUE FOLD
========================= */

.paperFold{
  position:absolute;

  top:0;
  right:0;

  width:210px;
  max-width:55vw;
  height:72px;

  z-index:20;

  pointer-events:none;

  background:
    linear-gradient(
      145deg,
      #89d2fa 0%,
      #a9e0fc 25%,
      #c8ecff 52%,
      #e5f7ff 76%,
      #ffffff 100%
    );

  clip-path:polygon(
    0 0,
    100% 72px,
    0 72px
  );

  filter:
    drop-shadow(
      -2px 4px 4px rgba(72,153,202,.16)
    );
}


/* =========================
   TATA IMAGE
========================= */

.tataImage{
  position:absolute;

  top:-88px;
  right:14px;

  width:165px;
  height:165px;

  object-fit:contain;

  z-index:30;

  pointer-events:none;

  transform:rotate(19deg);
  transform-origin:center;
}


/* =========================
   CONTENT
========================= */

.content{
  position:relative;

  z-index:2;

  width:100%;
  max-width:100%;

  min-height:calc(100vh - 85px);
  min-height:calc(100dvh - 85px);

  padding:
    18px
    18px
    125px;

  overflow:hidden;
}


/* =========================
   HEADING
========================= */

.addressHeading h1{
  margin:0;

  color:#17191c;

  font-size:28px;
  font-weight:800;

  line-height:1.15;

  letter-spacing:-0.8px;
}

.addressColor{
  color:#5b5bd6;
  font-weight:900;
}

.desktopHeading{
  display:block;
}

.desktopLine{
  display:block;
  white-space:nowrap;
}

.mobileHeading{
  display:none;
}

.orderingText{
  color:#5b5bd6;
  font-weight:900;
}

.forText{
  color:#24272b;
  font-weight:600;
}


/* =========================
   FRIEND / PARENTS / ME
========================= */

.orderTypeRow{
  width:100%;

  display:flex;
  align-items:center;

  gap:10px;

  margin-top:34px;
}

.orderTypeBox{
  flex:1;
  min-width:0;

  height:54px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#ffffff;

  border:1.5px solid #e0e1e6;
  border-radius:13px;

  color:#34363b;

  font-family:inherit;

  font-size:15px;
  font-weight:700;

  cursor:pointer;
  outline:none;

  transition:
    background .18s ease,
    border-color .18s ease,
    color .18s ease;
}


/* SELECTED */

.orderTypeBox.active{
  border-color:#5b5bd6;

  background:#f3f3ff;

  color:#5b5bd6;

  font-weight:800;
}


/* =========================
   ADDRESS FORM
========================= */

.addressForm{
  width:100%;
  margin-top:38px;
}


/* =========================
   NORMAL LINE FIELD
========================= */

.lineField{
  position:relative;

  width:100%;

  margin-bottom:27px;
}

.lineField label{
  display:block;

  margin-bottom:7px;

  color:#50535a;

  font-size:13px;
  font-weight:700;
}

.lineField input{
  display:block;

  width:100%;
  height:32px;

  padding:0 1px 8px;

  border:none;

  border-bottom:
    1.4px solid #d7d9de;

  border-radius:0;

  outline:none;

  background:transparent;

  color:#1e2024;

  font-family:inherit;

  font-size:16px;
  font-weight:600;

  appearance:none;
  -webkit-appearance:none;
}

.lineField input::placeholder{
  color:#a9adb4;
  font-weight:500;
}

.lineField input:focus{
  border-bottom-color:#5b5bd6;
}


/* =========================
   TWO FIELDS
========================= */

.twoFields{
  width:100%;

  display:flex;

  gap:20px;
}

.twoFields .lineField{
  flex:1;
  min-width:0;
}


/* =========================
   SMALL MAP + EMPTY LINE
========================= */

.mapAddressRow{
  width:100%;

  display:flex;
  align-items:center;

  gap:14px;

  margin-top:0;
  margin-bottom:28px;
}


/* =========================
   SMALL MAP
========================= */

.smallMapBox{
  position:relative;

  width:76px;
  height:62px;

  flex:0 0 76px;

  overflow:hidden;

  border:1px solid #dfe2e7;
  border-radius:12px;

  background:

    linear-gradient(
      35deg,
      transparent 44%,
      rgba(255,255,255,.96) 45%,
      rgba(255,255,255,.96) 51%,
      transparent 52%
    ),

    linear-gradient(
      145deg,
      transparent 45%,
      rgba(255,255,255,.95) 46%,
      rgba(255,255,255,.95) 51%,
      transparent 52%
    ),

    #e8edf0;

  box-shadow:
    0 3px 10px rgba(0,0,0,.04);
}


/* MAP AREAS */

.smallMapBox::before{
  content:"";

  position:absolute;

  width:28px;
  height:19px;

  top:6px;
  left:6px;

  border-radius:5px;

  background:#dce9dc;

  transform:rotate(-5deg);
}

.smallMapBox::after{
  content:"";

  position:absolute;

  width:30px;
  height:18px;

  right:5px;
  bottom:5px;

  border-radius:5px;

  background:#dde8dd;

  transform:rotate(4deg);
}


/* =========================
   MAP ROADS
========================= */

.smallRoad{
  position:absolute;

  z-index:2;

  background:#ffffff;

  box-shadow:
    0 0 0 1px rgba(210,214,218,.55);
}

.roadOne{
  width:105px;
  height:9px;

  left:-13px;
  top:27px;

  transform:rotate(-9deg);
}

.roadTwo{
  width:9px;
  height:90px;

  left:34px;
  top:-14px;

  transform:rotate(17deg);
}


/* =========================
   MAP PIN
========================= */

.smallMapPin{
  position:absolute;

  z-index:10;

  left:50%;
  top:50%;

  width:29px;
  height:29px;

  transform:
    translate(-50%,-62%);

  filter:
    drop-shadow(
      0 3px 3px rgba(0,0,0,.20)
    );
}

.smallMapPin svg{
  display:block;

  width:100%;
  height:100%;

  fill:#5b5bd6;
}


/* =========================
   MAP ADDRESS LINE
========================= */

.mapAddressLine{
  flex:1;

  min-width:0;

  display:flex;
  align-items:flex-end;
}

.mapAddressLine input{
  display:block;

  width:100%;
  height:38px;

  padding:
    0
    1px
    7px;

  border:none;

  border-bottom:
    1.4px solid #d7d9de;

  border-radius:0;

  outline:none;

  background:transparent;

  color:#1e2024;

  font-family:inherit;

  font-size:16px;
  font-weight:600;

  appearance:none;
  -webkit-appearance:none;
}

.mapAddressLine input:focus{
  border-bottom-color:#5b5bd6;
}


/* =========================
   LAST ANY INSTRUCTIONS
========================= */

.instructionsWrap{
  display:none;

  width:100%;

  margin-top:2px;
  margin-bottom:14px;
}


/* FRIEND / PARENTS */

.instructionsWrap.show{
  display:block;
}


.instructionsWrap textarea{
  display:block;

  width:100%;
  height:78px;

  padding:13px 14px;

  resize:none;

  outline:none;

  border:
    1.4px solid #dedfe5;

  border-radius:13px;

  background:#fafafd;

  color:#1e2024;

  font-family:inherit;

  font-size:14px;
  font-weight:500;

  line-height:1.4;
}


.instructionsWrap textarea::placeholder{
  color:#969aa2;
  opacity:1;
}


.instructionsWrap textarea:focus{
  border-color:#5b5bd6;

  background:#ffffff;
}


/* =========================
   FIXED SAVE BAR
========================= */

.saveAddressBar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  width:100%;

  z-index:100;

  padding:
    12px
    18px
    calc(12px + env(safe-area-inset-bottom));

  background:
    rgba(255,255,255,.96);

  border-top:
    1px solid #eeeef2;

  box-shadow:
    0 -8px 24px rgba(0,0,0,.06);
}


/* =========================
   SAVE BUTTON
========================= */

.saveAddressBtn{
  width:100%;
  height:54px;

  border:none;
  outline:none;

  border-radius:14px;

  background:#5b5bd6;

  color:#ffffff;

  font-family:inherit;

  font-size:16px;
  font-weight:800;

  letter-spacing:-0.2px;

  cursor:pointer;
}

.saveAddressBtn:active{
  transform:scale(.99);
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  html,
  body,
  .page{
    width:100%;
    max-width:100%;

    overflow-x:hidden;
  }


  .desktopHeading{
    display:none;
  }


  .mobileHeading{
    display:block;

    margin:0;

    font-size:26px;

    line-height:1.15;

    letter-spacing:-0.7px;

    white-space:nowrap;
  }


  .orderingText{
    font-weight:900;
  }


  .forText{
    font-weight:600;
  }


  .tataImage{
    top:-88px;
    right:14px;

    width:165px;
    height:165px;

    transform:rotate(19deg);
  }


  .content{
    padding-top:18px;
    padding-left:18px;
    padding-right:18px;

    padding-bottom:125px;
  }


  .orderTypeRow{
    gap:8px;

    margin-top:34px;
  }


  .orderTypeBox{
    height:52px;

    border-radius:12px;

    font-size:14px;
  }


  .addressForm{
    margin-top:38px;
  }


  .lineField{
    margin-bottom:25px;
  }


  .lineField label{
    margin-bottom:6px;

    font-size:13px;
  }


  .lineField input{
    height:31px;

    font-size:16px;
  }


  .twoFields{
    gap:18px;
  }


  /* MAP */

  .mapAddressRow{
    gap:13px;

    margin-bottom:26px;
  }


  .smallMapBox{
    width:72px;
    height:60px;

    flex:0 0 72px;

    border-radius:11px;
  }


  .smallMapPin{
    width:28px;
    height:28px;
  }


  .mapAddressLine input{
    height:36px;

    font-size:16px;
  }


  /* INSTRUCTIONS */

  .instructionsWrap{
    margin-top:1px;
    margin-bottom:12px;
  }


  .instructionsWrap textarea{
    height:76px;

    padding:12px 13px;

    border-radius:12px;

    font-size:14px;
  }


  /* SAVE */

  .saveAddressBar{
    padding-left:16px;
    padding-right:16px;
  }


  .saveAddressBtn{
    height:54px;

    border-radius:14px;

    font-size:16px;
  }

}

</style>
</head>


<body>


<div class="page">

  <div class="paperWrap">


    <!-- WHITE PAPER -->

    <div class="container">

      <div class="content">


        <!-- =========================
             HEADING
        ========================== -->

        <div class="addressHeading">


          <!-- DESKTOP -->

          <h1 class="desktopHeading">

            <span class="desktopLine">

              Help us know your

              <span class="addressColor">
                Address
              </span>

            </span>

            <span class="desktopLine">
              better for delivery.
            </span>

          </h1>


          <!-- MOBILE -->

          <h1 class="mobileHeading">

            <span class="orderingText">
              Ordering
            </span>

            <span class="forText">
              for
            </span>

          </h1>


        </div>


        <!-- =========================
             FRIEND / PARENTS / ME
        ========================== -->

        <div class="orderTypeRow">


          <button
            class="orderTypeBox"
            type="button"
            data-type="friend"
          >
            Friend
          </button>


          <button
            class="orderTypeBox"
            type="button"
            data-type="parents"
          >
            Parents
          </button>


          <button
            class="orderTypeBox active"
            type="button"
            data-type="me"
          >
            Me
          </button>


        </div>


        <!-- =========================
             ADDRESS FORM
        ========================== -->

        <div class="addressForm">


          <!-- FULL NAME -->

          <div class="lineField">

            <label>
              Full Name
            </label>

            <input
              type="text"
              placeholder="Enter full name"
              autocomplete="name"
            >

          </div>


          <!-- DOOR + ROOM -->

          <div class="twoFields">


            <div class="lineField">

              <label>
                Door No.
              </label>

              <input
                type="text"
                placeholder="Enter door no."
              >

            </div>


            <div class="lineField">

              <label>
                Room / Flat No.
              </label>

              <input
                type="text"
                placeholder="Enter flat no."
              >

            </div>


          </div>


          <!-- BUILDING -->

          <div class="lineField">

            <label>
              Building Name
            </label>

            <input
              type="text"
              placeholder="Enter building name"
            >

          </div>


          <!-- =========================
               SMALL MAP + EMPTY LINE
          ========================== -->

          <div class="mapAddressRow">


            <!-- SMALL MAP -->

            <div class="smallMapBox">


              <div class="smallRoad roadOne"></div>

              <div class="smallRoad roadTwo"></div>


              <div class="smallMapPin">

                <svg viewBox="0 0 24 24">

                  <path
                    d="
                    M12 2
                    C8.13 2 5 5.13 5 9
                    C5 14.25 12 22 12 22
                    S19 14.25 19 9
                    C19 5.13 15.87 2 12 2
                    Z
                    "
                  />

                  <circle
                    cx="12"
                    cy="9"
                    r="2.5"
                    fill="#ffffff"
                  />

                </svg>

              </div>


            </div>


            <!-- ONLY LINE -->

            <div class="mapAddressLine">

              <input
                type="text"
                aria-label="Address"
              >

            </div>


          </div>


          <!-- APARTMENT -->

          <div class="lineField">

            <label>
              Apartment Name
            </label>

            <input
              type="text"
              placeholder="Enter apartment name"
            >

          </div>


          <!-- ROAD -->

          <div class="lineField">

            <label>
              Road / Street Name
            </label>

            <input
              type="text"
              placeholder="Enter road or street name"
            >

          </div>


          <!-- VILLAGE -->

          <div class="lineField">

            <label>
              Village / Area
            </label>

            <input
              type="text"
              placeholder="Enter village or area"
            >

          </div>


          <!-- CITY + PIN -->

          <div class="twoFields">


            <div class="lineField">

              <label>
                Town / City
              </label>

              <input
                type="text"
                placeholder="Town / City"
              >

            </div>


            <div class="lineField">

              <label>
                PIN Code
              </label>

              <input
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="PIN code"
              >

            </div>


          </div>


          <!-- LANDMARK -->

          <div class="lineField">

            <label>
              Landmark
            </label>

            <input
              type="text"
              placeholder="Nearby landmark"
            >

          </div>


          <!-- =========================
               ANY INSTRUCTIONS
               LAST FIELD
          ========================== -->

          <div
            class="instructionsWrap"
            id="instructionsWrap"
          >

            <textarea
              id="instructions"
              placeholder="Any Instructions"
            ></textarea>

          </div>


        </div>


      </div>

    </div>


    <!-- BLUE FOLD -->

    <div class="paperFold"></div>


    <!-- TATA IMAGE -->

    <img
      src="tata.png"
      class="tataImage"
      alt=""
    >


  </div>

</div>


<!-- =========================
     FIXED SAVE ADDRESS
========================= -->

<div class="saveAddressBar">

  <button
    class="saveAddressBtn"
    type="button"
  >
    Save Address
  </button>

</div>


<script>

/* =========================
   FRIEND / PARENTS / ME
========================= */

const orderTypeButtons =
  document.querySelectorAll(".orderTypeBox");

const instructionsWrap =
  document.getElementById("instructionsWrap");

const instructions =
  document.getElementById("instructions");


orderTypeButtons.forEach((button) => {

  button.addEventListener("click", () => {


    orderTypeButtons.forEach((item) => {
      item.classList.remove("active");
    });


    button.classList.add("active");


    const selectedType =
      button.dataset.type;


    /* FRIEND / PARENTS */

    if(
      selectedType === "friend" ||
      selectedType === "parents"
    ){

      instructionsWrap.classList.add("show");

    }


    /* ME = HIDE */

    else{

      instructionsWrap.classList.remove("show");

      instructions.value = "";

    }

  });

});

</script>


</body>
</html>
